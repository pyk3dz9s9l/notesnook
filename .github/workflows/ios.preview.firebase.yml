name: Notesnook iOS Preview
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  build:
    needs: authorize
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 26.1.1
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG build:pre-install-node-modules"
        printf '%s\n' "GERALT_DBG head_sha=${GITHUB_SHA:-unset} head_ref=${GITHUB_HEAD_REF:-unset} base_ref=${GITHUB_BASE_REF:-unset}"
        printf '%s\n' "GERALT_DBG pwd=$(pwd 2>/dev/null || echo unknown)"
        if [ -f package.json ]; then
          printf '%s\n' "GERALT_DBG package.json FOUND"
          if command -v node >/dev/null 2>&1; then
            node -e "try{const p=require('./package.json');console.log('GERALT_DBG scripts='+JSON.stringify(p.scripts||{}))}catch(e){console.log('GERALT_DBG scripts-parse-error '+e.message)}" 2>/dev/null || true
          fi
        else
          printf '%s\n' "GERALT_DBG package.json NOT FOUND"
        fi
        if [ -f apps/mobile/package.json ]; then printf '%s\n' "GERALT_DBG apps/mobile/package.json FOUND"; else printf '%s\n' "GERALT_DBG apps/mobile/package.json NOT FOUND"; fi
      continue-on-error: true
    - name: Install node modules
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm run bootstrap -- --scope=mobile
    - name: Build packages
      run: npm run tx @notesnook/mobile:build
    - name: Install Pods
      run: |
        cd apps/mobile/ios
        pod install
    - name: Check for typescript errors
      run: |
        npm run tx mobile:build
        cd apps/mobile
        npx tsc --noEmit
    - name: Get marketing version
      id: marketing-version
      run: echo "version=$(grep "IOS_MARKETING_VERSION" apps/mobile/ios/build-configs/ios-build.staging.xcconfig | awk -F'=' '{print $2}' | xargs)" >> $GITHUB_OUTPUT
    - name: Get build number
      id: build-number
      run: echo "timestamp=$(($(date +%s) - 1774851180 ))" >> $GITHUB_OUTPUT
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG build:pre-xcodebuild"
        for f in apps/mobile/ios/Notesnook.xcodeproj/project.pbxproj apps/mobile/ios/Notesnook.xcworkspace/contents.xcworkspacedata apps/mobile/ios/build-configs/ios-build.staging.xcconfig apps/mobile/ios/ExportOptionsStaging.plist apps/mobile/ios/build-configs/use-ios-build-config.sh; do
          if [ -e "$f" ]; then printf '%s\n' "GERALT_DBG present: $f"; else printf '%s\n' "GERALT_DBG missing: $f"; fi
        done
        printf '%s\n' "GERALT_DBG marketing_version=$(grep -m1 'IOS_MARKETING_VERSION' apps/mobile/ios/build-configs/ios-build.staging.xcconfig 2>/dev/null || echo n/a)"
        if [ -e Notesnook.ipa ]; then printf '%s\n' "GERALT_DBG Notesnook.ipa present (pre-build)"; else printf '%s\n' "GERALT_DBG Notesnook.ipa absent (expected)"; fi
      continue-on-error: true
    - name: Make staging xcconfig active
      run: |
        cd apps/mobile/ios/build-configs
        ./use-ios-build-config.sh staging --marketing-version ${{steps.marketing-version.outputs.version}} --build-number ${{steps.build-number.outputs.timestamp}}
    - name: Build iOS App
      uses: ammarahm-ed/ios-build-action@master
      with:
        bundle-identifier: org.streetwriters.notesnook
        scheme: Notesnook
        configuration: Release
        export-options: apps/mobile/ios/ExportOptionsStaging.plist
        export-method: ad-hoc
        project-path: apps/mobile/ios/Notesnook.xcodeproj
        workspace-path: apps/mobile/ios/Notesnook.xcworkspace
        update-targets: |
          Notesnook
          Make Note
          NotesWidgetExtension
        disable-targets: Notesnook-tvOS,Notesnook-tvOSTests,NotesnookTests
        code-signing-identity: Apple Distribution
        team-id: ${{ secrets.APPLE_TEAM_ID }}
        p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        certificate-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        app-store-connect-api-key-issuer-id: ${{ secrets.API_KEY_ISSUER_ID }}
        app-store-connect-api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
        app-store-connect-api-key-base64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
        output-path: Notesnook.ipa
        mobileprovision-base64: |
          ${{ secrets.APPLE_MOBILE_PROVISION_ADHOC_APP }}
          ${{ secrets.APPLE_MOBILE_PROVISION_ADHOC_SHARE }}
          ${{ secrets.APPLE_MOBILE_PROVISION_ADHOC_WIDGET }}
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-preview-ipa
        path: Notesnook.ipa
        if-no-files-found: error
        retention-days: 1
  publish:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
    - name: Download IPA artifact
      uses: actions/download-artifact@v4
      with:
        name: ios-preview-ipa
        path: .
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' "GERALT_DBG publish:pre-firebase"
        if [ -f Notesnook.ipa ]; then
          printf '%s\n' "GERALT_DBG Notesnook.ipa present size_bytes=$(wc -c < Notesnook.ipa 2>/dev/null || echo unknown)"
        else
          printf '%s\n' "GERALT_DBG Notesnook.ipa MISSING"
        fi
        printf '%s\n' "GERALT_DBG pr_number=$(jq -r '.number // "unknown"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo unknown)"
      continue-on-error: true
    - name: Publish to firebase CLI
      id: firebase-output
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{secrets.FIREBASE_IOS_APP_ID}}
        serviceCredentialsFileContent: ${{ secrets.QA_SERVICE_ACCOUNT }}
        groups: testers
        file: Notesnook.ipa
        releaseNotes: Preview for https://github.com/streetwriters/notesnook/pull/${{github.event.number}}
    - name: Post or update PR comment
      uses: actions/github-script@v6
      env:
        preview_url: ${{ steps.firebase-output.outputs.TESTING_URI }}
      with:
        script: |
          const marker = '<!-- ios-preview-comment -->';
          const prNumber = context.issue.number;
          const previewUrl = process.env.preview_url || '';
          const body = `${marker}\n**iOS App Preview**\n\n${previewUrl || 'Preview URL unavailable — check workflow logs.'}\n\nCommit: ${process.env.GITHUB_SHA}\n`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    branches:
    - master
    - beta
    paths:
    - apps/mobile/**
    - packages/**
    - .github/workflows/ios.preview.firebase.yml
