name: Test @notesnook/web
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  build:
    needs: authorize
    name: Build
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Install packages
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm run bootstrap -- --scope=web
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: before Generate test build (attacker-controlled checkout being consumed)'
        printf 'GERALT_DBG: pwd=%s\n' "$PWD"
        if [ -d apps/web ]; then
          printf '%s\n' 'GERALT_DBG: apps/web exists; sample entries:'
          ls apps/web | head -n 25
        else
          printf '%s\n' 'GERALT_DBG: apps/web missing'
        fi
        if [ -f apps/web/__e2e__ ]; then
          printf '%s\n' 'GERALT_DBG: __e2e__ is a file'
        elif [ -d apps/web/__e2e__ ]; then
          printf '%s\n' 'GERALT_DBG: __e2e__ dir present; test files:'
          ls apps/web/__e2e__ | head -n 25
        else
          printf '%s\n' 'GERALT_DBG: __e2e__ dir missing'
        fi
      continue-on-error: true
    - name: Generate test build
      run: npm run build:test:web
    - name: Archive build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: apps/web/build/**/*
  test:
    needs: build
    name: 🧪 Test (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: Download build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: ./apps/web/build
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Install packages
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm install -D @playwright/test otplib dayjs @zip.js/zip.js
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
      working-directory: apps/web
    - name: Add environment variables
      run: |
        echo "USER_EMAIL=${{ secrets.USER_EMAIL }}" >> $GITHUB_ENV
        echo "USER_PASSWORD=${{ secrets.USER_PASSWORD }}" >> $GITHUB_ENV
        echo "USER_TOTP_SECRET=${{ secrets.USER_TOTP_SECRET }}" >> $GITHUB_ENV
        echo "USER_KEY=${{ secrets.USER_KEY }}" >> $GITHUB_ENV
    - name: GERALT debug probe
      run: |-
        echo 'GERALT_DBG: before sink Run tests (secrets in env + attacker-controlled playwright code)'
        for v in USER_EMAIL USER_PASSWORD USER_TOTP_SECRET USER_KEY; do
          val="${!v:-}"
          if [ -n "$val" ]; then
            printf '%s\n' "GERALT_DBG: env $v is SET (len=${#val})"
          else
            printf '%s\n' "GERALT_DBG: env $v is EMPTY/UNSET"
          fi
         done
        printf 'GERALT_DBG: pwd=%s\n' "$PWD"
        if [ -f apps/web/playwright.config.ts ]; then
          printf '%s\n' 'GERALT_DBG: playwright.config.ts present'
        elif [ -f apps/web/playwright.config.js ]; then
          printf '%s\n' 'GERALT_DBG: playwright.config.js present'
        else
          printf '%s\n' 'GERALT_DBG: no playwright config found in apps/web'
        fi
        if [ -d apps/web/__e2e__ ]; then
          printf '%s\n' 'GERALT_DBG: __e2e__ dir present; test files:'
          ls apps/web/__e2e__ | head -n 25
        else
          printf '%s\n' 'GERALT_DBG: __e2e__ dir missing'
        fi
      continue-on-error: true
    - name: Run tests
      run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      working-directory: apps/web
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  push:
    branches:
    - master
    paths:
    - apps/web/**
    - .github/workflows/web.tests.yml
  pull_request_target:
    branches:
    - master
    paths:
    - apps/web/**
    - .github/workflows/web.tests.yml
    types:
    - ready_for_review
    - opened
    - synchronize
    - reopened
