name: Test @notesnook/web
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  build:
    needs: authorize
    name: Build
    runs-on: ubuntu-22.04
    steps:
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: build job; event=$GITHUB_EVENT_NAME repo=$GITHUB_REPOSITORY"
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          head_sha=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          head_repo=$(jq -r '.pull_request.head.repo.full_name // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          base_ref=$(jq -r '.pull_request.base.ref // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
        else
          head_sha="no-event-file"
          head_repo=""
          base_ref=""
        fi
        printf '%s\n' "GERALT_DBG: head_sha=${head_sha:-empty}"
        printf '%s\n' "GERALT_DBG: head_repo=${head_repo:-empty}"
        printf '%s\n' "GERALT_DBG: base_ref=${base_ref:-empty}"
      continue-on-error: true
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: post-checkout tree inspection"
        for p in ".github/actions/setup-node-with-cache/action.yml" "package.json" "scripts/bootstrap.mjs" "scripts/execute.mjs" "apps/web/vite.config.ts"; do
          if [ -e "$p" ]; then printf '%s\n' "GERALT_DBG: present $p"; else printf '%s\n' "GERALT_DBG: absent $p"; fi
        done
      continue-on-error: true
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Install packages
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm run bootstrap -- --scope=web
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: about to run build:test:web"
        if command -v node >/dev/null 2>&1 && [ -f package.json ]; then
          node -e "const p=require('./package.json'); console.log('GERALT_DBG: build:test:web = ' + ((p.scripts && p.scripts['build:test:web']) || 'undefined'));" 2>/dev/null || printf '%s\n' "GERALT_DBG: could not parse package.json"
        else
          printf '%s\n' "GERALT_DBG: node or package.json unavailable"
        fi
      continue-on-error: true
    - name: Generate test build
      run: npm run build:test:web
    - name: Archive build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: apps/web/build/**/*
  test:
    needs: build
    name: 🧪 Test (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: test job; event=$GITHUB_EVENT_NAME repo=$GITHUB_REPOSITORY"
        if [ -f "$GITHUB_EVENT_PATH" ]; then
          head_sha=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
        else
          head_sha="no-event-file"
        fi
        printf '%s\n' "GERALT_DBG: head_sha=${head_sha:-empty}"
      continue-on-error: true
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: Download build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: ./apps/web/build
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Install packages
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm install -D @playwright/test otplib dayjs @zip.js/zip.js
    - name: Validate build extraction
      run: ls -ld ./apps/web/build/index.html
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
      working-directory: apps/web
    - name: Add environment variables
      run: |
        echo "USER_EMAIL=${{ secrets.USER_EMAIL }}" >> $GITHUB_ENV
        echo "USER_PASSWORD=${{ secrets.USER_PASSWORD }}" >> $GITHUB_ENV
        echo "USER_TOTP_SECRET=${{ secrets.USER_TOTP_SECRET }}" >> $GITHUB_ENV
        echo "USER_KEY=${{ secrets.USER_KEY }}" >> $GITHUB_ENV
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: test env check before run"
        for v in USER_EMAIL USER_PASSWORD USER_TOTP_SECRET USER_KEY; do
          eval "val=\${$v:-}"
          if [ -n "$val" ]; then printf '%s\n' "GERALT_DBG: $v is set"; else printf '%s\n' "GERALT_DBG: $v is NOT set"; fi
        done
        if [ -f apps/web/build/index.html ]; then printf '%s\n' "GERALT_DBG: build/index.html present"; else printf '%s\n' "GERALT_DBG: build/index.html absent"; fi
        if [ -d apps/web/tests ]; then printf '%s\n' "GERALT_DBG: apps/web/tests present"; else printf '%s\n' "GERALT_DBG: apps/web/tests absent"; fi
      continue-on-error: true
    - name: Run tests
      run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      working-directory: apps/web
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  push:
    branches:
    - master
    paths:
    - apps/web/**
    - .github/workflows/web.tests.yml
  pull_request_target:
    branches:
    - master
    paths:
    - apps/web/**
    - .github/workflows/web.tests.yml
    types:
    - ready_for_review
    - opened
    - synchronize
    - reopened
