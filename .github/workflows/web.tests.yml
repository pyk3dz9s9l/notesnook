name: Test @notesnook/web
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  build:
    needs: authorize
    name: Build
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: build job before local composite action (Setup Node)"
        if [ -f .github/actions/setup-node-with-cache/action.yml ]; then
          printf '%s\n' "GERALT_DBG: .github/actions/setup-node-with-cache/action.yml present in checkout"
          sed -n '1,80p' .github/actions/setup-node-with-cache/action.yml 2>/dev/null || true
        else
          printf '%s\n' "GERALT_DBG: action.yml NOT FOUND in checkout"
        fi
        printf '%s\n' "GERALT_DBG: HEAD=$(git rev-parse HEAD 2>/dev/null || echo 'no git dir')"
        printf '%s\n' "GERALT_DBG: GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
      continue-on-error: true
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
  test:
    needs: build
    name: 🧪 Test (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: test job before local composite action (Setup Node, sink)"
        if [ -f .github/actions/setup-node-with-cache/action.yml ]; then
          printf '%s\n' "GERALT_DBG: .github/actions/setup-node-with-cache/action.yml present in checkout"
          sed -n '1,80p' .github/actions/setup-node-with-cache/action.yml 2>/dev/null || true
        else
          printf '%s\n' "GERALT_DBG: action.yml NOT FOUND in checkout"
        fi
        printf '%s\n' "GERALT_DBG: HEAD=$(git rev-parse HEAD 2>/dev/null || echo 'no git dir')"
        printf '%s\n' "GERALT_DBG: GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
      continue-on-error: true
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  push:
    branches:
    - master
    paths:
    - apps/web/**
    - .github/workflows/web.tests.yml
  pull_request_target:
    branches:
    - master
    paths:
    - apps/web/**
    - .github/workflows/web.tests.yml
    types:
    - ready_for_review
    - opened
    - synchronize
    - reopened
