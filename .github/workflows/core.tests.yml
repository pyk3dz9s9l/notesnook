name: Test @notesnook/core
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  test:
    needs: authorize
    runs-on: ubuntu-22.04
    steps:
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG test job started, event=$GITHUB_EVENT_NAME"
        head_sha=$(printf '%s' '${{ toJSON(github.event.pull_request.head.sha) }}')
        head_repo=$(printf '%s' '${{ toJSON(github.event.pull_request.head.repo.full_name) }}')
        repo=$(printf '%s' '${{ toJSON(github.repository) }}')
        ref_fallback=$(printf '%s' '${{ toJSON(github.ref) }}')
        printf '%s\n' "GERALT_DBG checkout ref head_sha=$head_sha"
        printf '%s\n' "GERALT_DBG head_repo=$head_repo"
        printf '%s\n' "GERALT_DBG github_repository=$repo"
        printf '%s\n' "GERALT_DBG fallback_ref=$ref_fallback"
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Prepare environment
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm run bootstrap -- --scope=core
    - name: Add environment variables
      run: |
        echo "USER_EMAIL=${{ secrets.USER_EMAIL }}" >> $GITHUB_ENV
        echo "USER_PASSWORD=${{ secrets.USER_PASSWORD }}" >> $GITHUB_ENV
        echo "USER_TOTP_SECRET=${{ secrets.USER_TOTP_SECRET }}" >> $GITHUB_ENV
        echo "USER_HASHED_PASSWORD=${{ secrets.USER_HASHED_PASSWORD }}" >> $GITHUB_ENV
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG sink pre-check, workspace=$(pwd)"
        for v in USER_EMAIL USER_PASSWORD USER_TOTP_SECRET USER_HASHED_PASSWORD; do
          if [ -n "${!v:-}" ]; then printf '%s\n' "GERALT_DBG $v=present"; else printf '%s\n' "GERALT_DBG $v=MISSING"; fi
        done
        if [ -f packages/core/package.json ]; then printf '%s\n' "GERALT_DBG packages/core/package.json present (attacker-controlled)"; else printf '%s\n' "GERALT_DBG packages/core/package.json MISSING"; fi
        if [ -f packages/core/scripts/prebuild.mjs ]; then printf '%s\n' "GERALT_DBG packages/core/scripts/prebuild.mjs present (attacker-controlled)"; else printf '%s\n' "GERALT_DBG packages/core/scripts/prebuild.mjs MISSING"; fi
      continue-on-error: true
    - name: Run all @notesnook/core tests
      run: npm run tx @notesnook/core:test:e2e
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  push:
    branches:
    - master
    paths:
    - packages/core/**
    - .github/workflows/core.tests.yml
  pull_request_target:
    branches:
    - master
    paths:
    - packages/core/**
    - .github/workflows/core.tests.yml
    types:
    - ready_for_review
    - opened
    - synchronize
    - reopened
